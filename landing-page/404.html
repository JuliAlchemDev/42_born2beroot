<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Montserrat:wght@700;800;900&amp;display=swap"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/custom.css" />
    <link rel="stylesheet" href="./styles/404.css" />
    <title>Connection lost</title>
  </head>
  <body>
    <header>
      <p class="header__server-status">404 lost in orbit</p>
    </header>
    <main>
      <img
        class="earth"
        width="200"
        height="auto"
        src="./src/earth.png"
        alt=""
      />
      <img
        class="laptop"
        width="150"
        height="auto"
        src="./src/laptop.png"
        alt=""
      />
      <img
        class="astronaut"
        width="200"
        height="auto"
        src="./src/astronaut.png"
        alt=""
      />
      <img class="moon" width="450" height="auto" src="./src/moon.png" alt="" />


    </main>
     <section class="message">
        <h1 class="message__title">
          Oh, what a cruel world of virtualization...
        </h1>
        <p class="message__text">We can't find the page you're looking for</p>
        <a class="message__link" href="/">
          <svg class="message__link-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20">
              <path
                d="M3 17L17 3M17 3H8M17 3V12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
          Back to the station</a>
      </section>
  </body>
</html>
